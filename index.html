
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wanainchi Poster Studio</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101116;
    color: white;
}

header {
    padding: 22px 6%;
    background: #191b23;
    border-bottom: 1px solid #30323c;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1px;
}

.logo span { color: #f4b400; }

header small { color: #999; }

.container {
    max-width: 1250px;
    margin: auto;
    padding: 35px 20px;
}

.welcome {
    margin-bottom: 30px;
}

.welcome h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.welcome p { color: #999; }

.workspace {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.panel {
    background: #1b1d26;
    padding: 25px;
    border-radius: 14px;
    border: 1px solid #30323c;
}

h2 {
    font-size: 19px;
    margin-top: 0;
}

label {
    display: block;
    margin: 18px 0 8px;
    color: #bbb;
    font-size: 13px;
}

input, select {
    width: 100%;
    padding: 13px;
    background: #101116;
    border: 1px solid #383b47;
    border-radius: 7px;
    color: white;
    outline: none;
}

input:focus, select:focus {
    border-color: #f4b400;
}

.upload {
    border: 2px dashed #494c59;
    border-radius: 10px;
    padding: 30px;
    text-align: center;
    margin-top: 18px;
    color: #aaa;
}

button {
    background: #f4b400;
    border: none;
    padding: 14px 20px;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

button:hover { background: #ffd04a; }

.preview {
    min-height: 470px;
    background: #11131a;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    overflow: hidden;
}

.preview h1 {
    font-size: 34px;
    color: #f4b400;
}

.preview p { color: #aaa; }

@media(max-width: 800px) {
    .workspace { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
    <div class="logo">WANAINCHI <span>STUDIO</span></div>
    <small>SPORTS POSTER CREATOR</small>
</header>

<div class="container">

    <div class="welcome">
        <h1>Welcome to Poster Studio</h1>
        <p>Create professional sports posters for your teams.</p>
    </div>

    <div class="workspace">

        <section class="panel">
            <h2>01. Create Your Poster</h2>

         <label>Select Organisation</label>

<select id="club" onchange="updateLogo()">
    <option value="sports">Wanainchi Sports Club</option>
    <option value="hdf">Wanainchi HDF</option>
</select>

<div style="text-align:center; margin-top:15px;">
    <img id="clubLogo"
         src="assets/wanainchi-sports-club.png"
         style="max-width:130px; max-height:100px; object-fit:contain;">
</div>

            <label>Poster Category</label>
            <select id="category">
                <option>Matchday</option>
                <option>Fixture Announcement</option>
                <option>Full Time Result</option>
                <option>Tournament Announcement</option>
                <option>Player Spotlight</option>
            </select>
            <label>Choose Poster Design</label>
<select id="design">
    <option value="stadium">Stadium Energy</option>
    <option value="modern">Modern Professional</option>
    <option value="minimal">Clean Minimal</option>
</select>

            <label>Our Team</label>
<input id="ourTeam" placeholder="Enter our team name">

<label>Opponent</label>
<input id="opponent" placeholder="Enter opponent name">
            <label>Wanainchi Score</label>
<input id="ourScore" type="number" min="0" placeholder="Enter our score">

<label>Opponent Score</label>
<input id="opponentScore" type="number" min="0" placeholder="Enter opponent score">

            <label>Match Date</label>
            <input id="date" type="date">

            <label>Match Time</label>
            <input id="time" type="time">

            <label>Venue</label>
            <input id="venue" placeholder="Enter venue">
            <label>Player Name</label>
<input id="playerName" placeholder="Enter player name">

<label>Player Position</label>
<input id="playerPosition" placeholder="Enter player position">

<label>Player Achievement</label>
<input id="playerAchievement" placeholder="Enter achievement or statistics">

            <label>Upload Match Photo</label>
            <div class="upload">
                <input id="photo" type="file" accept="image/*">
                <p>Choose your team or action photo</p>
            </div>

            <br>
            <button onclick="generatePoster()">GENERATE POSTER</button>
        </section>

        <section class="panel">
            <h2>02. Poster Preview</h2>

            <div class="preview" id="preview">
                <h1>WANAINCHI</h1>
                <p>YOUR NEXT GREAT POSTER STARTS HERE</p>
                <p>Upload a photo and enter match details.</p>
            </div>
            <button onclick="downloadPoster()" style="margin-top:15px;width:100%;">
    DOWNLOAD POSTER
</button>
        </section>

    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
    function updateLogo() {
    const club = document.getElementById("club").value;
    const logo = document.getElementById("clubLogo");

    if (club === "sports") {
        logo.src = "assets/wanainchi-sports-club.png";
    } else {
        logo.src = "assets/wanainchi-hdf.png";
    }
}
function generatePoster() {
   
    const opponent = document.getElementById("opponent").value;
    const ourTeam = document.getElementById("ourTeam").value;
    const ourScore = document.getElementById("ourScore").value;
const opponentScore = document.getElementById("opponentScore").value;
    const category = document.getElementById("category").value;
    const design = document.getElementById("design").value;
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;
    const venue = document.getElementById("venue").value;
    const playerName = document.getElementById("playerName").value;
const playerPosition = document.getElementById("playerPosition").value;
const playerAchievement = document.getElementById("playerAchievement").value;
    const photo = document.getElementById("photo").files[0];
    const club = document.getElementById("club").value;

const logoPath = club === "sports"
    ? "assets/wanainchi-sports-club.png"
    : "assets/wanainchi-hdf.png";
    const primaryColor = club === "sports" ? "#f4d000" : "#e31b23";
const secondaryColor = club === "sports" ? "#087a3e" : "#ffffff";

   if (category !== "Player Spotlight" && (!ourTeam || !opponent)) {
    alert("Please enter both team names.");
    return;
}

if (category === "Player Spotlight" && !playerName) {
    alert("Please enter the player's name.");
    return;
}
if (category === "Full Time Result" && (ourScore === "" || opponentScore === "")) {
    alert("Please enter both teams' final scores.");
    return;
}
    const preview = document.getElementById("preview");
    const reader = new FileReader();

    function displayPoster(imageUrl = "") {
        preview.innerHTML = `
            <div style="
                width:100%;
aspect-ratio:4 / 5;
min-height:500px;
padding:25px;
                background:${design === "stadium"
    ? "linear-gradient(160deg, #263858, #080b14)"
    : design === "modern"
    ? "linear-gradient(160deg, #252a35, #111827)"
    : "linear-gradient(160deg, #181818, #303030)"};
                border:2px solid ${primaryColor};
                border-radius:10px;
                display:flex;
                flex-direction:column;
                align-items:center;
                justify-content:space-between;
                text-align:center;
                overflow:hidden;
            ">
                <img src="${logoPath}"
     style="max-width:150px;
     max-height:90px;
     object-fit:contain;
     margin-bottom:10px;">

                <h2 style="color:white;">
                    ${category.toUpperCase()}
                </h2>

                ${imageUrl ? `
                    <img src="${imageUrl}"
                    style="width:100%;max-height:230px;
                    object-fit:cover;border-radius:8px;">
                ` : ""}

        ${category === "Player Spotlight" ? `
    <div style="text-align:center;width:100%;">

        <h1 style="color:${primaryColor};"font-size:32px;">
            PLAYER SPOTLIGHT
        </h1>

        <h1 style="color:white;font-size:38px;">
            ${playerName.toUpperCase()}
        </h1>

        <h2 style="color:${primaryColor};">
            ${playerPosition.toUpperCase()}
        </h2>

        <p style="color:white;font-size:18px;">
            ${playerAchievement}
        </p>

    </div>
` : `
    <div style="display:flex;
                justify-content:space-around;
                align-items:center;
                width:100%;
                gap:10px;">

        <div style="flex:1;">
            <h2 style="color:white;">
                ${ourTeam.toUpperCase()}
            </h2>
            ${category === "Full Time Result" ? `
                <h1 style="color:${primaryColor};font-size:48px;">
                    ${ourScore}
                </h1>
            ` : ""}
        </div>

        <h1 style="color:${primaryColor};font-size:32px;">
            ${category === "Full Time Result" ? ":" : "VS"}
        </h1>

        <div style="flex:1;">
            <h2 style="color:white;">
                ${opponent.toUpperCase()}
            </h2>
            ${category === "Full Time Result" ? `
                <h1 style="color:${primaryColor};font-size:48px;">
                    ${opponentScore}
                </h1>
            ` : ""}
        </div>

    </div>
`}
    <h1 style="color:${primaryColor};font-size:32px;">
        ${category === "Full Time Result" ? ":" : "VS"}
    </h1>

    <div style="flex:1;">
        <h2 style="color:white;">
            ${opponent.toUpperCase()}
        </h2>
        ${category === "Full Time Result" ? `
            <h1 style="color:${primaryColor};font-size:48px;">
                ${opponentScore}
            </h1>
        ` : ""}
    </div>

</div>

                <p style="color:white;">
                    ${date} ${time}
                </p>

                <p style="color:white;">
                    ${venue}
                </p>
            </div>
        `;
    }

    if (photo) {
        reader.onload = function(event) {
            displayPoster(event.target.result);
        };
        reader.readAsDataURL(photo);
    } else {
        displayPoster();
    }
}
async function downloadPoster() {
    const poster = document.getElementById("preview");

    if (!poster.querySelector("img")) {
        alert("Please generate a poster first.");
        return;
    }

    try {
        const canvas = await html2canvas(poster, {
            scale: 3,
            useCORS: true,
            backgroundColor: "#11131a"
        });

        const link = document.createElement("a");
        link.download = "Wanainchi-Poster.png";
        link.href = canvas.toDataURL("image/png");
        link.click();

    } catch (error) {
        alert("Unable to download poster. Please try again.");
        console.error(error);
    }
}
</script>

</body>
</html>
